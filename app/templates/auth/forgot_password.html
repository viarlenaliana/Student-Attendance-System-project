{% extends "base.html" %}
{% block title %}Quên mật khẩu - Student Attendance System{% endblock %}
{% block content %}
<div class="auth-card p-4 p-md-5">
  <h1 class="h4 fw-bold mb-1 text-center">Quên mật khẩu</h1>
  <p class="text-muted small text-center mb-4">Bước 1/3: Nhập email đã đăng ký để nhận mã OTP khôi phục</p>

  <form method="post" action="{{ url_for('auth.forgot_password_page') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label fw-semibold" for="email">Email đã đăng ký</label>
      <input
        type="email"
        class="form-control"
        id="email"
        name="email"
        value="{{ entered_email or '' }}"
        placeholder="example@university.edu.vn"
        required
        autofocus
      >
    </div>

    <div class="d-grid gap-2">
      <button type="submit" class="btn btn-primary">Gửi mã OTP</button>
      <a href="{{ url_for('auth.verify_otp_page') }}" class="btn btn-outline-secondary">Tôi đã có mã OTP</a>
      <a href="{{ url_for('auth.login_page') }}" class="btn btn-link text-decoration-none">Quay lại đăng nhập</a>
    </div>
  </form>
</div>
{% endblock %}
