{% extends "base.html" %}
{% block title %}Đặt lại mật khẩu - Student Attendance System{% endblock %}
{% block content %}
<div class="auth-card p-4 p-md-5">
  <h1 class="h4 fw-bold mb-1 text-center">Đặt lại mật khẩu</h1>
  <p class="text-muted small text-center mb-4">Bước 3/3: Tạo mật khẩu mới cho <strong>{{ verified_email }}</strong></p>

  <form method="post" action="{{ url_for('auth.reset_password_page') }}" data-confirm-password-form>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label fw-semibold" for="new_password">Mật khẩu mới</label>
      <div class="input-group">
        <input type="password" class="form-control" id="new_password" name="new_password" required autofocus>
        <button type="button" class="btn btn-outline-secondary" data-toggle-password="new_password">Hiện</button>
      </div>
      <div class="form-text">Tối thiểu 8 ký tự, bao gồm chữ hoa, chữ thường và chữ số.</div>
    </div>

    <div class="mb-4">
      <label class="form-label fw-semibold" for="confirm_password">Xác nhận mật khẩu mới</label>
      <div class="input-group">
        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
        <button type="button" class="btn btn-outline-secondary" data-toggle-password="confirm_password">Hiện</button>
      </div>
    </div>

    <div class="d-grid gap-2">
      <button type="submit" class="btn btn-primary">Cập nhật mật khẩu</button>
      <a href="{{ url_for('auth.login_page') }}" class="btn btn-outline-secondary">Hủy</a>
    </div>
  </form>
</div>
{% endblock %}
