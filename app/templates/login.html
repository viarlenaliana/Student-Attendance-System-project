{% extends "base.html" %}
{% block title %}Đăng nhập - Student Attendance System{% endblock %}
{% block content %}
<div class="auth-card p-4 p-md-5">
  <h1 class="h4 fw-bold mb-1 text-center">Đăng nhập</h1>
  <p class="text-muted small text-center mb-4">Sử dụng tài khoản do Quản trị viên cung cấp</p>

  <form method="post" action="{{ url_for('auth.login_page') }}" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label fw-semibold" for="username">Tên đăng nhập</label>
      <input
        type="text"
        class="form-control"
        id="username"
        name="username"
        value="{{ entered_username or '' }}"
        placeholder="Nhập tên đăng nhập"
        required
        autofocus
      >
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold" for="password">Mật khẩu</label>
      <div class="input-group">
        <input
          type="password"
          class="form-control"
          id="password"
          name="password"
          placeholder="Nhập mật khẩu"
          required
        >
        <button type="button" class="btn btn-outline-secondary" data-toggle-password="password">Hiện</button>
      </div>
    </div>

    <div class="d-grid mb-3">
      <button type="submit" class="btn btn-primary btn-lg">Đăng nhập</button>
    </div>

    <div class="text-center">
      <a href="{{ url_for('auth.forgot_password_page') }}" class="text-decoration-none small">Quên mật khẩu? Khôi phục qua OTP email</a>
    </div>
  </form>
</div>
{% endblock %}
