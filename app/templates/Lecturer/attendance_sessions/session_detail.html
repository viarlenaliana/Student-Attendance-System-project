<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết phiên điểm danh</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        button, input, select {
            padding: 10px;
            margin: 5px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        img {
            max-width: 300px;
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Chi tiết phiên điểm danh</h1>

    <div class="card">
        <p><b>Session ID:</b> {{ session.session_id }}</p>
        <p><b>Schedule ID:</b> {{ session.schedule_id }}</p>
        <p><b>Phương thức:</b> {{ session.method }}</p>
        <p><b>Trạng thái:</b> {{ session.status }}</p>
    </div>

    <div class="card">
        <h2>Chọn phương thức điểm danh</h2>

        <select id="method">
            <option value="QR code">QR code</option>
            <option value="Password">Password</option>
            <option value="QR code combined with password">
                QR code combined with password
            </option>
            <option value="Manual attendance">Manual attendance</option>
        </select>

        <button onclick="changeMethod()">Lưu phương thức</button>
    </div>

    <div class="card">
        <h2>QR Code</h2>

        <button onclick="refreshQR()">Tạo / Làm mới QR</button>

        <p id="qr_message"></p>
        <div id="qr_container"></div>
    </div>

    <div class="card">
        <h2>Mật khẩu điểm danh</h2>

        <input
            type="password"
            id="attendance_password"
            placeholder="Nhập mật khẩu">

        <button onclick="setPassword()">Lưu mật khẩu</button>

        <p id="password_message"></p>
    </div>

    <div class="card">
        <h2>Liên kết Student</h2>

        <a href="/attendance-sessions/{{ session.session_id }}/student">
            Mở giao diện điểm danh Student
        </a>
    </div>

</div>

<script>
    const session_id = {{ session.session_id }};
    const base_url = "/attendance-sessions";

    document.getElementById("method").value = {{ session.method | tojson }};

    async function changeMethod() {
        const method = document.getElementById("method").value;

        const response = await fetch(
            `${base_url}/${session_id}/method`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({method: method})
            }
        );

        const result = await response.json();

        alert(result.message);

        if (result.success) {
            location.reload();
        }
    }

    async function refreshQR() {
        const response = await fetch(
            `${base_url}/${session_id}/qr`,
            {
                method: "POST"
            }
        );

        const result = await response.json();

        if (!result.success) {
            document.getElementById("qr_message").innerText =
                result.message;
            return;
        }

        const qr_text = `${session_id}|${result.token}`;

        document.getElementById("qr_message").innerText =
            "QR đã được tạo. Token có thời hạn 60 giây.";

        document.getElementById("qr_container").innerHTML = "";

        const qr_img = document.createElement("img");

        qr_img.src =
            "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data="
            + encodeURIComponent(qr_text);

        document.getElementById("qr_container").appendChild(qr_img);
    }

    async function setPassword() {
        const password = document.getElementById("attendance_password").value;

        const response = await fetch(
            `${base_url}/${session_id}/password`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({password: password})
            }
        );

        const result = await response.json();

        document.getElementById("password_message").innerText =
            result.message;
    }
</script>

</body>
</html>
